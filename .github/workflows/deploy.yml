name: Deploy to GitHub Pages

# Builds the site from the MECo foundation (zachtheyek/meco-data) and publishes it.
#
# Deploys run ONLY on push (incl. merging a drift-review PR) and manual dispatch — no schedule.
# CRUCIALLY, the build is pinned to the MECo commit recorded in DATA_VERSION — the version the prose
# was last reconciled against — NOT to meco-data's HEAD. So new upstream *data* can never reach the
# site through an ordinary code push: it only moves when DATA_VERSION is bumped, and that bump only
# happens inside the reconciliation PR opened by `drift-review.yml`. A human reviews and merges that
# PR (curating the text, analysis and graphs on every refresh), and that merge is what publishes the
# new data. `public/data` is generated here, not committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nadi-demokrasi
      # Pin the data foundation to the human-reconciled commit (DATA_VERSION), never HEAD — this is
      # what makes every data refresh human-gated: unreconciled upstream data cannot slip out.
      - name: Read the reconciled data version
        id: dv
        run: echo "sha=$(tr -d '[:space:]' < nadi-demokrasi/DATA_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: zachtheyek/meco-data   # the shared data foundation (public)
          ref: ${{ steps.dv.outputs.sha }}    # pinned to DATA_VERSION, not HEAD
          path: meco-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow numpy
      - name: Compute indicators from MECo foundation
        run: python scripts/compute_indicators.py   # reads ../meco-data/out -> writes public/data
        working-directory: nadi-demokrasi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nadi-demokrasi/package-lock.json
      - run: npm ci
        working-directory: nadi-demokrasi
      - run: npm run build
        working-directory: nadi-demokrasi
        env:
          SITE_URL: https://zachtheyek.github.io/nadi-demokrasi
      - name: Stamp the deployed data version (the MECo commit this build was generated from)
        run: git -C meco-data rev-parse HEAD > nadi-demokrasi/dist/data-version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nadi-demokrasi/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
