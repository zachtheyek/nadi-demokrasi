name: Deploy to GitHub Pages

# Builds the site from the live MECo foundation (zachtheyek/meco-data) and publishes it.
#
# Deploys run ONLY on push (incl. merging a drift-review PR) and manual dispatch — there is no
# weekly schedule here. New upstream *data* reaches the site only through the reconciliation PR
# opened by `drift-review.yml`, so a general election can never auto-publish stale prose: a human
# reviews and merges the PR, and that merge is what triggers this deploy. `public/data` is
# generated here, not committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nadi-demokrasi
      - uses: actions/checkout@v4
        with:
          repository: zachtheyek/meco-data   # the shared data foundation (public)
          path: meco-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow numpy
      - name: Compute indicators from MECo foundation
        run: python scripts/compute_indicators.py   # reads ../meco-data/out -> writes public/data
        working-directory: nadi-demokrasi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nadi-demokrasi/package-lock.json
      - run: npm ci
        working-directory: nadi-demokrasi
      - run: npm run build
        working-directory: nadi-demokrasi
        env:
          SITE_URL: https://zachtheyek.github.io/nadi-demokrasi
      - name: Stamp the deployed data version (the MECo commit this build was generated from)
        run: git -C meco-data rev-parse HEAD > nadi-demokrasi/dist/data-version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nadi-demokrasi/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
